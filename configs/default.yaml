project:
  name: rsna-knee
  version: 0.1.0

data:
  raw_dir: data/raw
  processed_dir: data/processed
  external_dir: data/external
  train_csv: data/raw/train.csv
  train_series_csv: data/raw/train_series.csv
  test_csv: data/raw/test.csv
  test_series_csv: data/raw/test_series.csv
  sample_submission_csv: data/raw/sample_submission.csv

labels:
  columns:
    - ACL
    - MCL
    - Medial Meniscus
    - Lateral Meniscus
    - Medial OA
    - Lateral OA
    - PF OA
    - Effusion
    - Synovitis
    - "Baker's"
    - Contusion
    - Fracture
  gold_study_count: 58
  not_addressed_value: 0.5

extraction:
  default_method: regex
  llm:
    provider: openai
    model: gpt-4o
    temperature: 0.0
    max_retries: 3

validation:
  threshold: 0.5
  gold_comparison: true

imaging:
  dicom_dir: data/raw/train_series
  target_shape: [30, 256, 256]
  normalization: minmax

experiments:
  dir: experiments
  format: jsonl

split:
  val_frac: 0.20
  seed: 42
  group_col: Report
  reserve_gold_to_val: true
  output_dir: data/processed/splits/v1

clustering:
  k: 4
  method: kmeans
  seed: 42
  metadata_table_path: data/processed/series_metadata.csv
  output_path: data/processed/series_clusters.csv

classical:
  main_backbone: facebook/dinov2-base
  specialist_backbone: facebook/dinov2-small
  image_size: 336
  n_groups_per_slot: 10
  batch_size: 16
  lr: 1.0e-5
  weight_decay: 0.01
  grad_accum_steps: 1
  warmup_steps: 100
  max_epochs: 20
  ema_decay_main: 0.999
  ema_decay_specialist: 0.995
  use_amp: true
  cosine_t_max: 20
  checkpoint_dir: data/processed/checkpoints
  ensemble_weights:
    main: 0.5
    specialist: 0.5
  augmentation:
    enabled: true
    rotation_deg: 10.0
    gamma_range: [0.8, 1.2]
    rescale_range: [0.95, 1.05]
