[project]
name = "rsna-knee"
version = "0.1.0"
description = "RSNA Knee Abnormality Detection Competition"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "pydicom>=2.4.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
rebuild = [
    "torch>=2.2.0",
    "timm>=1.0.0",
    "opencv-python-headless>=4.8.0",
    "anthropic[bedrock]>=2.3.0",
    "tabulate>=0.9.0",
]
classical = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
